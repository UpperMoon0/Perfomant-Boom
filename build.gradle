plugins {
    id 'dev.architectury.loom' version '1.11.458' apply false
    id 'architectury-plugin' version '3.4.162'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    if (project.name == 'core' || project.name.startsWith('neoforge-')) return
    def modern = project.name.endsWith('1.21.1')
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Keep loader artifacts distinct, for example perfomant_boom-forge.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${modern ? '1.21.1' : rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
        testImplementation 'org.mockito:mockito-core:5.3.1'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    }

    test {
        useJUnitPlatform()
        minHeapSize = "512m"
        maxHeapSize = "2048m"
    }

    java {
        // Publish sources alongside the remapped loader artifacts.
        withSourcesJar()

        toolchain.languageVersion = JavaLanguageVersion.of(modern ? 21 : 17)
        sourceCompatibility = modern ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
        targetCompatibility = modern ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = modern ? 21 : 17
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

    }
}

tasks.register('buildAll') {
    group = 'build'
    dependsOn ':core:check', ':common:test', ':common-1.21.1:test', ':fabric:build', ':forge:build', ':fabric-1.21.1:build', ':neoforge-1.21.1:build', ':neoforge-26.1.2:build'
}

// Include the redistribution license in every published JAR.
allprojects {
    tasks.withType(Jar).configureEach {
        from(rootProject.file("LICENSE")) { rename { "LICENSE_${rootProject.name}" } }
    }
}
