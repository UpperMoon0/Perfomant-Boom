plugins {
    id 'com.gradleup.shadow'
}

loom {
    forge {
        runs {
            liveBoomTestClient {
                client()
                runDir("run/live-boom/${System.getenv('PERFOMANT_BOOM_TEST_RUN') ?: 'default'}/client")
                vmArg "-Xmx1280m"
                property "perfomant_boom.liveTest", "true"
                programArgs "--quickPlayMultiplayer", "127.0.0.1:${System.getenv('PERFOMANT_BOOM_TEST_PORT') ?: '25585'}"
            }
            liveBoomTestServer {
                server()
                runDir("run/live-boom/${System.getenv('PERFOMANT_BOOM_TEST_RUN') ?: 'default'}/server")
                vmArg "-Xmx1280m"
                property "perfomant_boom.liveTest", "true"
            }
            boomGameTestServer {
                environment("gametestserver")
                forgeTemplate("gameTestServer")
                runDir("run/game-test")
                property "forge.enabledGameTestNamespaces", "perfomant_boom,minecraft"
            }
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

tasks.matching { it.name == 'runBoomGameTestServer' }.configureEach {
    doFirst {
        project.copy {
            from rootProject.file('common/src/gametest/resources/gameteststructures')
            into project.file('run/game-test/gameteststructures')
        }
    }
}

loom { forge { mixinConfig 'perfomant_boom.terrain.mixins.json' } }

// Development Minecraft uses named classes; the packaged refmap targets production SRG.
loom { runs { configureEach { vmArg '-Dmixin.env.disableRefMap=true' } } }
