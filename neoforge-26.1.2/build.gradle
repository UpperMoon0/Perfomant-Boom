plugins { id 'java-library'; id 'maven-publish'; id 'net.neoforged.moddev' version '2.0.141' }
base { archivesName = 'perfomant_boom-neoforge-26.1.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets.main.java.srcDir rootProject.file('core/src/main/java')
sourceSets.main.java.srcDir rootProject.file('common-26.1.2/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common-26.1.2/src/main/resources')
neoForge {
    version = '26.1.2.99'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { perfomant_boom { sourceSet sourceSets.main } }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    doLast {
        def config = file("$destinationDir/perfomant_boom.terrain.mixins.json")
        def parsed = new groovy.json.JsonSlurper().parse(config)
        parsed.remove('refmap')
        config.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(parsed)) + '\n'
    }
}
publishing { publications { mavenJava(MavenPublication) { from components.java; artifactId = base.archivesName.get() } } }

sourceSets.main.java.srcDir rootProject.file('common-modern/src/main/java')

sourceSets.main.java.srcDir rootProject.file('terrain-common/src/main/java')

sourceSets.test.java.srcDir rootProject.file('common-modern/src/test/java')
repositories { mavenCentral() }
dependencies { testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'; testRuntimeOnly 'org.junit.platform:junit-platform-launcher' }
test { useJUnitPlatform() }

neoForge { unitTest { enable(); testedMod = mods.perfomant_boom } }

dependencies { testImplementation 'net.neoforged:testframework:26.1.2.99' }
